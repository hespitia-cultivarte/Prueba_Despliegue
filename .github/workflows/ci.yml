name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    name: Verificar tipos y compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: astro check
        run: npm run check

      - name: astro build
        run: npm run build
